const SLOT = 'bz-learn-key';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const msg = (t, err) => { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); };
const norm = s => s.trim().toLowerCase().split(/[\s\-_.,]+/).filter(Boolean).join('-');
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SLOT) || sessionStorage.getItem(SLOT) || 'null'); } catch (e) { return null; } },
  set(v, keep) { try { (keep ? localStorage : sessionStorage).setItem(SLOT, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SLOT); sessionStorage.removeItem(SLOT); } catch (e) {} }
};
async function render(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
  const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
async function derive(pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pass)), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter }, base, 256);
}
(async () => {
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { msg('This browser is too old to open locked pages.', true); return; }
  if (new URLSearchParams(location.search).has('lock')) { store.clear(); msg('Locked on this device.'); return; }
  const saved = store.get();
  if (saved && saved.kid === P.kid) {
    try { await render(b64(saved.k)); return; } catch (e) { store.clear(); }
  }
  document.getElementById('pw').focus();
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const go = document.getElementById('go');
  go.disabled = true; msg('Unlocking...');
  const keep = document.getElementById('rem').checked;
  try {
    const raw = await derive(document.getElementById('pw').value);
    await render(raw);
    store.set({ kid: P.kid, k: enc(raw) }, keep);
  } catch (e) {
    go.disabled = false; msg('That passphrase did not open this page.', true);
  }
});
