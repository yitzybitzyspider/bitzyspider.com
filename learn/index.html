<title>Locked · bitzyspider</title>

<style>
/* Lock screen for the private /learn/ section. The real page is AES-GCM ciphertext below; it only renders after the passphrase derives the right key. */
:root{--bg:#09090b;--card:#141417;--line:#1f1f23;--fg:#f4f4f5;--muted:#a1a1aa;--red:#dc2626;--red-bright:#ef4444;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;--sans:ui-sans-serif,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top img{width:28px;height:28px}
.label{font:600 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red-bright)}
h1{font-size:1.4rem;margin:0 0 4px}
p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input[type=password]:focus{outline:2px solid var(--red);outline-offset:1px;border-color:transparent}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;color:var(--muted);font-size:.9rem}
.row input{accent-color:var(--red);width:16px;height:16px}
button{width:100%;font:600 .95rem var(--sans);color:#fff;background:var(--red);border:0;border-radius:8px;padding:11px;cursor:pointer}
button:hover{background:var(--red-bright)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.4em;margin:12px 0 0;font:500 .85rem var(--mono);color:var(--muted)}
.msg.err{color:var(--red-bright)}
.hidden{display:none}
</style>
</head>
<body>
<main class="card" id="gate">
  <div class="top"><img src="/favicon.svg" alt=""><span class="label">bitzyspider / learn</span></div>
  <h1>Private notes</h1>
  <p>Enter the passphrase to open this page.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="bitzyspider-learn" autocomplete="username" class="hidden" aria-hidden="true" tabindex="-1">
    <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase" required>
    <label class="row"><input type="checkbox" id="rem" checked> Remember on this device</label>
    <button id="go" type="submit">Unlock</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</main>
<script>

const SLOT = 'bz-learn-key';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const msg = (t, err) => { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); };
const norm = s => s.trim().toLowerCase().split(/[\s\-_.,]+/).filter(Boolean).join('-');
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SLOT) || sessionStorage.getItem(SLOT) || 'null'); } catch (e) { return null; } },
  set(v, keep) { try { (keep ? localStorage : sessionStorage).setItem(SLOT, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SLOT); sessionStorage.removeItem(SLOT); } catch (e) {} }
};
async function render(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
  const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
async function derive(pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pass)), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter }, base, 256);
}
(async () => {
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { msg('This browser is too old to open locked pages.', true); return; }
  if (new URLSearchParams(location.search).has('lock')) { store.clear(); msg('Locked on this device.'); return; }
  const saved = store.get();
  if (saved && saved.kid === P.kid) {
    try { await render(b64(saved.k)); return; } catch (e) { store.clear(); }
  }
  document.getElementById('pw').focus();
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const go = document.getElementById('go');
  go.disabled = true; msg('Unlocking...');
  const keep = document.getElementById('rem').checked;
  try {
    const raw = await derive(document.getElementById('pw').value);
    await render(raw);
    store.set({ kid: P.kid, k: enc(raw) }, keep);
  } catch (e) {
    go.disabled = false; msg('That passphrase did not open this page.', true);
  }
});
