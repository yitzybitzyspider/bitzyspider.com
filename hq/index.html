<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>HQ</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root { --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; --red: #dc2626; --dim: #71717a; --line: #1f1f23; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #000; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif;
           display: grid; place-items: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    main { width: 100%; max-width: 420px; text-align: center; }
    [hidden] { display: none !important; }
    .eyebrow { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--red); margin: 0 0 1.5rem; }
    .note { font-family: var(--mono); font-size: 0.78rem; line-height: 1.8; color: var(--dim); margin: 1rem 0 0; }
    button { font: inherit; cursor: pointer; }
    .primary { width: 100%; min-height: 52px; border-radius: 10px; border: 1px solid #3f3f46; background: #fff; color: #000;
               font-weight: 600; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; }
    .primary:active { transform: scale(0.99); }
    .primary:focus-visible, .link:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
    .link { background: none; border: 0; color: var(--dim); font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.16em;
            text-transform: uppercase; padding: 12px; margin-top: 1.5rem; }
    /* ---- deck ---- */
    body.deck-on { display: block; padding: 0; overflow: hidden; overscroll-behavior: none; }
    body.deck-on main { max-width: 480px; height: 100dvh; margin: 0 auto; display: flex; text-align: left; }
    #v-deck { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
    .bar .eyebrow { margin: 0; }
    .bar .meta { font-family: var(--mono); font-size: 0.68rem; color: var(--dim); letter-spacing: 0.06em; flex: 1; text-align: right; }
    .bar .link { margin: 0; padding: 12px 0 12px 12px; }
    .stack { position: relative; flex: 1; min-height: 0; margin: 22px 0 12px; }
    .card { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px; overflow: hidden;
            background: #0c0c0f; border: 1px solid var(--line); border-radius: 18px; touch-action: none; user-select: none; -webkit-user-select: none;
            transform: translateY(calc(var(--depth, 0) * -9px)) scale(calc(1 - var(--depth, 0) * 0.04)); transform-origin: 50% 0;
            transition: transform 0.2s ease, opacity 0.2s ease; box-shadow: 0 10px 40px rgba(0,0,0,0.6); cursor: grab; }
    .card.dragging { transition: none; cursor: grabbing; }
    .card.alert { border-color: #7f1d1d; background: #140a0a; }
    .card:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    .card[data-bucket="startup"] { --tint: #f97316; } .card[data-bucket="hackathon"] { --tint: #a78bfa; }
    .card[data-bucket="community"] { --tint: #38bdf8; } .card[data-bucket="inputs"] { --tint: #a1a1aa; } .card { --tint: #71717a; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px;
            border: 1px solid var(--line); color: #a1a1aa; }
    .chip.bucket { color: var(--tint); border-color: color-mix(in srgb, var(--tint) 45%, transparent); }
    .chip.hot { color: #fca5a5; border-color: #7f1d1d; }
    .card h2 { margin: 0; font-size: 1.35rem; line-height: 1.25; font-weight: 650; overflow-wrap: anywhere; }
    .scroll { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px;
              -webkit-mask-image: linear-gradient(#000 calc(100% - 40px), transparent); mask-image: linear-gradient(#000 calc(100% - 40px), transparent); }
    .card.expanded .scroll { overflow-y: auto; touch-action: pan-y; user-select: text; -webkit-user-select: text; -webkit-mask-image: none; mask-image: none; overscroll-behavior: contain; }
    .scroll > * { flex-shrink: 0; }
    .body { color: #d4d4d8; font-size: 1rem; line-height: 1.55; overflow-wrap: anywhere; }
    .k { display: block; font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
    .k.ctx { margin-bottom: -6px; }
    .draft { background: #111114; border: 1px solid #27272a; border-left: 3px solid #22c55e; border-radius: 10px; padding: 12px 14px; }
    .draft .line { margin: 0 0 6px; display: flex; gap: 10px; align-items: baseline; font-size: 0.9rem; color: #d4d4d8; overflow-wrap: anywhere; }
    .draft .line .k { min-width: 56px; }
    .draft .text { margin: 8px 0 0; white-space: pre-wrap; font-size: 1.02rem; line-height: 1.55; color: #fff; overflow-wrap: anywhere; }
    .draft .line + .text { border-top: 1px solid #27272a; padding-top: 10px; }
    .draft .will { margin-top: 8px; }
    .field { display: block; margin: 0 0 10px; } .field .k { margin-bottom: 4px; }
    .field input, .field textarea, .sheet textarea { width: 100%; font: inherit; font-size: 16px; color: #fff; background: #000; border: 1px solid #3f3f46; border-radius: 8px; padding: 10px; }
    .field textarea { min-height: 160px; resize: vertical; line-height: 1.5; }
    .field input:focus-visible, .field textarea:focus-visible, .sheet textarea:focus-visible { outline: 2px solid #22c55e; outline-offset: 1px; }
    .why, .revnote { border-radius: 10px; padding: 10px 14px; }
    .why { background: #1a1205; border: 1px solid #713f12; } .why .k { color: #fde68a; }
    .revnote { background: #0b1410; border: 1px solid #14532d; } .revnote .k { color: #86efac; }
    .why p, .revnote p { margin: 4px 0 8px; font-size: 0.92rem; line-height: 1.45; color: #e4e4e7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .why p:last-child, .revnote p:last-child { margin-bottom: 0; }
    .card.todo { border-color: #713f12; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
    .mini { min-height: 44px; padding: 0 14px; margin: -6px -6px -6px 0; border-radius: 10px; border: 1px solid #3f3f46; background: #18181b; color: #fff;
            font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
    .chip.good { color: #86efac; border-color: #14532d; }
    .md p, .md ul, .md ol, .md blockquote, .md pre { margin: 0 0 0.7em; } .md ul, .md ol { padding-left: 1.2em; }
    .md h3, .md h4, .md h5 { margin: 0 0 0.4em; font-size: 1rem; }
    .md a, .open { color: #93c5fd; } .md code { font-family: var(--mono); font-size: 0.85em; background: #18181b; padding: 1px 5px; border-radius: 4px; }
    .md pre { background: #18181b; padding: 10px; border-radius: 8px; overflow-x: auto; } .md pre code { padding: 0; }
    .md blockquote { border-left: 2px solid #3f3f46; padding-left: 12px; color: #a1a1aa; }
    .will { margin: 0; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.04em; color: #86efac; }
    .open { font-family: var(--mono); font-size: 0.72rem; align-self: flex-start; padding: 8px 0; }
    .rows { display: none; list-style: none; margin: 0; padding: 0; }
    .card.expanded .rows { display: block; }
    .rows label { display: flex; align-items: center; gap: 12px; min-height: 44px; border-top: 1px solid var(--line); }
    .rows input { width: 20px; height: 20px; accent-color: #22c55e; } .rows small { margin-left: auto; color: var(--dim); font-family: var(--mono); }
    .stamp { position: absolute; top: 18px; font-family: var(--mono); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase;
             padding: 6px 10px; border: 2px solid; border-radius: 8px; opacity: 0; pointer-events: none; background: #0c0c0f; }
    .stamp.right { left: 18px; color: #22c55e; transform: rotate(-8deg); } .stamp.left { right: 18px; color: #ef4444; transform: rotate(8deg); }
    .stamp.up { left: 50%; top: auto; bottom: 18px; transform: translateX(-50%); color: #FDB515; }
    .stamp.down { left: 50%; transform: translateX(-50%); color: #93c5fd; }
    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr 1.25fr; gap: 8px; }
    .act { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: #0c0c0f; color: #fff; font-family: var(--mono);
           font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 4px; }
    .act:active { transform: scale(0.97); } .act:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    .act[data-dir="left"] { color: #fca5a5; } .act[data-dir="up"] { color: #fde68a; } .act[data-dir="down"] { color: #93c5fd; } .act[data-dir="right"] { color: #000; background: #22c55e; border-color: #22c55e; font-weight: 700; }
    .toast { position: fixed; left: 50%; top: calc(4px + env(safe-area-inset-top)); transform: translateX(-50%); width: min(448px, calc(100vw - 32px));
             display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 6px 4px 16px; min-height: 48px;
             background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; font-size: 0.9rem; z-index: 5; }
    .toast.error { border-color: #7f1d1d; color: #fca5a5; padding-right: 16px; }
    .toast button { background: none; border: 0; color: #93c5fd; font-weight: 600; min-height: 44px; padding: 0 12px; }
    .sheet { width: min(480px, 100vw); max-width: 100vw; margin: auto auto 0; border: 0; border-top: 1px solid #3f3f46; border-radius: 18px 18px 0 0;
             background: #0c0c0f; color: #fff; padding: 18px 16px max(16px, env(safe-area-inset-bottom)); }
    .sheet::backdrop { background: rgba(0,0,0,0.7); }
    .sheet h2 { margin: 0 0 4px; font-size: 1.1rem; } .sheet .note { margin: 0 0 12px; text-align: left; }
    .sheet textarea { min-height: 120px; resize: none; line-height: 1.5; }
    .sheet .btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 12px; }
    .sheet .act.send { background: #93c5fd; border-color: #93c5fd; color: #000; font-weight: 700; } .sheet .act:disabled { opacity: 0.4; }
    .empty { flex: 1; display: grid; place-content: center; text-align: center; gap: 4px; }
    .empty h2 { margin: 0; font-size: 1.6rem; }
    .loading .bar .meta { opacity: 0.6; }
    @media (prefers-reduced-motion: reduce) { .card, .act { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section id="v-signin" hidden>
      <button class="primary" id="signin" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.200 6.900-10.300 6.900-17.700z"/><path fill="#FBBC05" d="M10.500 28.600a14.500 14.500 0 0 1 0-9.200l-7.900-6.200a24 24 0 0 0 0 21.600l7.900-6.200z"/><path fill="#34A853" d="M24 48c6.300 0 11.700-2.100 15.600-5.700l-7.700-6c-2.100 1.400-4.900 2.300-7.900 2.300-6.300 0-11.600-4.200-13.500-10l-7.900 6.200C6.500 42.600 14.600 48 24 48z"/></svg>
        Sign in with Google
      </button>
    </section>
    <section id="v-checking" hidden><p class="note" role="status">Checking access</p></section>
    <section id="v-denied" hidden>
      <p class="eyebrow">Private</p>
      <p class="note">This page belongs to one person, and that account is not it. You have been signed out.</p>
      <button class="link" id="retry" type="button">Use a different account</button>
    </section>
    <section id="v-error" hidden>
      <p class="eyebrow">Something broke</p>
      <p class="note" id="error-text"></p>
      <button class="link" id="reload" type="button">Try again</button>
    </section>
    <section id="v-deck" hidden>
      <header class="bar">
        <p class="eyebrow">HQ</p>
        <span class="meta" data-cleared role="status" aria-live="polite"></span>
        <button class="link" id="signout" type="button">Sign out</button>
      </header>
      <div class="stack" data-stack></div>
      <div class="empty" data-empty hidden>
        <h2 data-empty-title>Deck clear</h2>
        <p class="note" data-empty-note></p>
        <button class="link" data-reload type="button">Check again</button>
      </div>
      <div class="actions" data-actions hidden>
        <button class="act" data-dir="left" type="button">Dismiss</button>
        <button class="act" data-dir="up" type="button">Snooze</button>
        <button class="act" data-dir="down" type="button">Revise</button>
        <button class="act" data-dir="right" type="button">Approve</button>
      </div>
      <dialog class="sheet" data-sheet aria-labelledby="sheet-title">
        <form data-sheet-form method="dialog">
          <h2 id="sheet-title" data-sheet-title>What should change?</h2>
          <p class="note">Type or dictate. An agent rewrites it and the card comes back.</p>
          <textarea data-note aria-label="Your note" placeholder="Shorter, and mention Thursday" enterkeyhint="send"></textarea>
          <div class="btns">
            <button class="act" data-cancel type="button">Cancel</button>
            <button class="act send" data-send type="submit" disabled>Send back</button>
          </div>
        </form>
      </dialog>
      <div class="toast" data-toast role="status" aria-live="polite" hidden>
        <span data-toast-text></span><button data-undo type="button">Undo</button>
      </div>
    </section>
    <noscript><p class="note">HQ needs JavaScript.</p></noscript>
  </main>
  <script src="vendor/supabase-2.45.4.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="md.js"></script>
  <script src="deck.js"></script>
  <script src="deck-ui.js"></script>
  <script src="demo.js"></script>
  <script>
    (function () {
      var views = ["signin", "checking", "denied", "error", "deck"];
      var $ = function (id) { return document.getElementById(id); };
      var sb = supabase.createClient(HQ_CONFIG.url, HQ_CONFIG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" } });
      var deck = null;
      function startDeck(source) {
        if (!deck) { deck = new HQDeck.Deck(source); HQDeckUI.mount($("v-deck"), deck); }
        deck.load();
      }
      function must(r) { if (r.error) throw new Error(r.error.message); return r; }
      var api = {
        deck: async function () { return must(await sb.from("today_deck").select("*")).data; },
        cleared: async function () {
          var d = new Date(); d.setHours(0, 0, 0, 0);
          return must(await sb.from("cards").select("id", { count: "exact", head: true }).in("status", ["done", "approved", "dismissed"]).gte("updated_at", d.toISOString())).count;
        },
        sources: async function () { return must(await sb.from("sources").select("name,enabled,last_ok_at,expected_interval")).data; },
        swipe: async function (id, dir, until, veto, edit) { must(await sb.rpc("hq_swipe", { p_card: id, p_dir: dir, p_snooze_until: until, p_veto: veto, p_edit: edit })); },
        revise: async function (id, note) { must(await sb.rpc("hq_revise", { p_card: id, p_note: note })); },
        unswipe: async function (id) { must(await sb.rpc("hq_unswipe", { p_card: id })); }
      };
      var ui = {
        show: function (view, state) {
          views.forEach(function (v) { $("v-" + v).hidden = v !== view; });
          if (view === "error") $("error-text").textContent = state.error;
          document.body.classList.toggle("deck-on", view === "deck");
          if (view === "deck") startDeck(api);
        },
        onSignIn: function (fn) { $("signin").addEventListener("click", fn); $("retry").addEventListener("click", fn); },
        onSignOut: function (fn) { $("signout").addEventListener("click", fn); }
      };
      $("reload").addEventListener("click", function () { location.replace("/hq/"); });
      if (window.HQ_DEMO) {   // localhost only, see demo.js
        views.forEach(function (v) { $("v-" + v).hidden = v !== "deck"; });
        document.body.classList.add("deck-on"); $("signout").hidden = true;
        return startDeck(HQ_DEMO.api);
      }
      HQAuth.boot(sb, ui, location).catch(function (e) { ui.show("error", { error: String(e && e.message || e) }); });
    })();
  </script>
</body>
</html>
