name: HQ tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["hq/**", "supabase/**", "tests/hq-*", "tests/lib/**", "scripts/hq/**", "docs/hq/**", ".github/workflows/hq-tests.yml"]
permissions:
  contents: read
jobs:
  code:
    name: logic, UI behavior, wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/hq/test.sh
  database:
    name: clean database from migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/hq/test-db.sh
