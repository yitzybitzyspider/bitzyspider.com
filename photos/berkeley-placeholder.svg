<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-label="UC Berkeley Haas placeholder banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001d3d"/>
      <stop offset="0.65" stop-color="#003262"/>
      <stop offset="1" stop-color="#00457f"/>
    </linearGradient>
    <linearGradient id="goldfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDB515" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FDB515" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FDB515" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" fill="url(#sky)"/>

  <!-- faint hill line -->
  <path d="M0 340 Q 400 300 830 330 T 1600 320 L 1600 400 L 0 400 Z" fill="#002a52"/>

  <!-- Sather Tower (the Campanile) silhouette -->
  <g fill="#FDB515">
    <!-- lantern finial at the apex -->
    <rect x="1208" y="30" width="4" height="10"/>
    <circle cx="1210" cy="29" r="3"/>
    <!-- steep pyramidal roof -->
    <polygon points="1182,100 1210,38 1238,100"/>
    <!-- cornice above the belfry -->
    <rect x="1180" y="98" width="60" height="8"/>
    <!-- open colonnaded belfry: four tall narrow arched openings -->
    <rect x="1184" y="106" width="52" height="54"/>
    <g fill="#003262">
      <rect x="1189" y="112" width="7.5" height="42" rx="3.75"/>
      <rect x="1200" y="112" width="7.5" height="42" rx="3.75"/>
      <rect x="1211" y="112" width="7.5" height="42" rx="3.75"/>
      <rect x="1222" y="112" width="7.5" height="42" rx="3.75"/>
    </g>
    <!-- ledge between belfry and clock stage -->
    <rect x="1182" y="160" width="56" height="7"/>
    <!-- shaft with corner piers -->
    <rect x="1190" y="167" width="40" height="175"/>
    <g fill="#003262" opacity="0.35">
      <rect x="1196.5" y="196" width="2.5" height="146"/>
      <rect x="1221" y="196" width="2.5" height="146"/>
    </g>
    <!-- clock face below the belfry, on the shaft -->
    <circle cx="1210" cy="181" r="10" fill="#003262"/>
    <circle cx="1210" cy="181" r="7" fill="#FDB515"/>
    <line x1="1210" y1="181" x2="1210" y2="176" stroke="#003262" stroke-width="1.5"/>
    <line x1="1210" y1="181" x2="1214" y2="182.5" stroke="#003262" stroke-width="1.5"/>
    <!-- base -->
    <rect x="1184" y="342" width="52" height="14"/>
  </g>

  <!-- wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="start">
    <text x="150" y="185" fill="#ffffff" font-size="58" font-weight="bold" letter-spacing="2">BERKELEY</text>
    <text x="150" y="248" fill="#FDB515" font-size="58" font-weight="bold" letter-spacing="9">HAAS</text>
  </g>
  <rect x="150" y="272" width="300" height="3" fill="url(#goldfade)"/>
  <text x="150" y="308" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="19" letter-spacing="3">MBA + M.ENG &#183; CLASS OF 2028</text>
</svg>
